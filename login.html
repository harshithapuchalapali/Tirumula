<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirumula Dairy — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-divider"><span></span></div>
        <span class="login-name">Tirumula Dairy</span>
        <div class="login-divider"><span></span></div>
        <span class="login-tag">Sign in to your account</span>
      </div>
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn pri login-btn" id="loginBtn"><i class="fas fa-arrow-right"></i> Sign In</button>
        <p class="login-err" id="loginErr"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const sb = window.supabase.createClient(
      'https://wwsctdtyohiqabwtbmhn.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3c2N0ZHR5b2hpcWFid3RibWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNTYxMzEsImV4cCI6MjA5NzYzMjEzMX0.qwNRfFm4H_wocKQyz2yo5csRAXLNcPwmFZNRBLg-UT0'
    );

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginErr');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      errEl.textContent = '';

      const { data: authData, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = error.message;
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign In';
        return;
      }

      const { data: profile } = await sb.from('profiles').select('role').eq('id', authData.user.id).maybeSingle();
      const role = profile?.role || (email === 'admindiary@gmail.com' ? 'admin' : 'user');
      localStorage.setItem('td_role', role);

      if (role === 'admin') window.location.href = 'index.html';
      else window.location.href = 'user.html';
    });
  </script>
</body>
</html>
